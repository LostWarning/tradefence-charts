apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
data:
  redis.conf: |
    # Redis configuration
    loglevel {{ .Values.redis.loglevel }}

    # Memory management
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}

    # Timeout for idle clients (in seconds, 0 = disabled)
    timeout {{ .Values.redis.timeout }}

    # TCP keepalive
    tcp-keepalive {{ .Values.redis.tcpKeepalive }}

    # Disable persistence (ephemeral only)
    save ""
    appendonly no

    # Database
    databases 16

    # Clients
    maxclients 10000

    # Replication
    # This Redis instance is standalone, no replication

    # Snapshots - disabled for ephemeral storage
    # save 900 1
    # save 300 10
    # save 60 10000

    {{- if .Values.redis.customConfig }}
    # Custom configuration
    {{- range $key, $value := .Values.redis.customConfig }}
    {{ $key }} {{ $value }}
    {{- end }}
    {{- end }}
