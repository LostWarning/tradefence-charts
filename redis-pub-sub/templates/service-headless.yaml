apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  # Headless service - no cluster IP assigned
  # This enables direct DNS access to individual pods
  clusterIP: None

  # Publish DNS for all pods, including those not yet ready
  publishNotReadyAddresses: true

  ports:
  - port: {{ .Values.containerPort }}
    targetPort: redis
    protocol: TCP
    name: redis

  selector:
    app: {{ .Values.appName }}
