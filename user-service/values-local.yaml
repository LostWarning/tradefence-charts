# Local k3d configuration for API Gateway

appName: user-service
namespace: app
environment: local
# Docker image
image:
  repository: ghcr.io/lostwarning/user-service
  tag: main-aaa456f
  pullPolicy: IfNotPresent
# Replica count (reduced for local)
replicaCount: 2
# Service configuration
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090
# Container ports
grpcPort: 9090
healthPort: 8080
# Resource limits and requests (reduced for local)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Horizontal Pod Autoscaling (disabled for local)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  # Custom metrics for WebSocket connections
  customMetrics:
    - name: websocket_connections_per_pod
      targetAverageValue: "1000"
# Pod Disruption Budget (disabled for local)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# Application configuration
config:
  logLevel: "DEBUG" # More verbose for local dev
  custom: {}
