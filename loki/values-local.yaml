# Loki v3.5.7 - Local Development Configuration (Distributed with MinIO S3)

# Deployment mode - SimpleScalable for write/read/backend components
deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  # Storage bucket configuration (REQUIRED for S3)
  storage:
    bucketNames:
      chunks: loki-logs
      ruler: loki-logs
      admin: loki-logs
    type: s3
    s3:
      endpoint: http://host.k3d.internal:9000
      insecure: true
      s3ForcePathStyle: true
      # WARNING: Hardcoded credentials for local development only
      # Production/Staging should use Kubernetes secrets
      secretAccessKey: password123
      accessKeyId: admin

  # Schema configuration
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Common configuration for distributed mode
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: etcd
        etcd:
          endpoints:
            - "http://etcd-0.etcd.infrastructure.svc.cluster.local:2379"
            - "http://etcd-1.etcd.infrastructure.svc.cluster.local:2379"
            - "http://etcd-2.etcd.infrastructure.svc.cluster.local:2379"

  # Limits config
  limits_config:
    ingestion_rate_mb: 5
    ingestion_burst_size_mb: 10
    max_streams_per_user: 1000
    max_entries_limit_per_query: 5000
    volume_enabled: true

# Disable single binary mode
singleBinary:
  enabled: false

# Disable ruler to simplify deployment
ruler:
  enabled: false

# Enable distributed components
write:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard-rwo
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

read:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard-rwo
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

backend:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard-rwo
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Promtail disabled - using OpenTelemetry Collector for log collection
promtail:
  enabled: false
