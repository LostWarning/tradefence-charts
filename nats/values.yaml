# NATS Cluster - Default Values
appName: nats
namespace: infrastructure
version: "2.12.2"
environment: local

# Docker image
image:
  repository: nats
  tag: "2.12.2-alpine"
  pullPolicy: IfNotPresent

revisionHistoryLimit: 0

# Number of replicas
replicaCount: 3

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 3

# Pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - nats
          topologyKey: kubernetes.io/hostname

# Container ports
ports:
  client: 4222
  cluster: 6222
  monitoring: 8222

# Liveness probe configuration
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Readiness probe configuration
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# NATS configuration
nats:
  logLevel: "debug"
  maxConnections: "500"
  maxPayload: "1048576"
  writeDeadline: "2s"

# Cluster configuration
cluster:
  name: tradefence-nats
