apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-client
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
  annotations:
    config.linkerd.io/opaque-ports: "4222"
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.appName }}
  ports:
  - name: tcp
    port: {{ .Values.ports.client }}
    targetPort: nats-client
    protocol: TCP
