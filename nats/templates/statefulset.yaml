apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  serviceName: {{ .Values.appName }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.ports.monitoring }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ .Values.appName }}

      # Pod security context
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}

      containers:
      - name: nats
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        # Command to start NATS with config file
        command:
          - nats-server
        args:
          - --config
          - /etc/nats/nats.conf

        # Container ports
        ports:
        - name: nats-client
          containerPort: {{ .Values.ports.client }}
          protocol: TCP
        - name: nats-cluster
          containerPort: {{ .Values.ports.cluster }}
          protocol: TCP
        - name: nats-monitoring
          containerPort: {{ .Values.ports.monitoring }}
          protocol: TCP

        # Environment variables for debugging
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Volume mounts
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: pid
          mountPath: /var/run/nats

        # Liveness probe using HTTP monitoring endpoint
        livenessProbe:
          httpGet:
            path: /healthz
            port: nats-monitoring
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

        # Readiness probe using HTTP monitoring endpoint
        readinessProbe:
          httpGet:
            path: /healthz
            port: nats-monitoring
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

        # Resource limits
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        # Container security context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

      # Volumes
      volumes:
      - name: nats-config
        configMap:
          name: {{ .Values.appName }}-config
          defaultMode: 0644
      - name: tmp
        emptyDir: {}
      - name: pid
        emptyDir: {}
