# NATS Local Development Values
appName: nats
namespace: infrastructure

# 3 replicas for basic cluster testing
replicaCount: 3

# Minimal resources for local development
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# NATS configuration for local
nats:
  logLevel: "debug"
  maxConnections: "500"
  maxPayload: "1048576"

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# No strict affinity for local
affinity: {}
