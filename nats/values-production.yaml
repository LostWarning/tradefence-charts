# NATS Production Environment Values
appName: nats
namespace: infrastructure
environment: production

# 5 replicas for high availability
replicaCount: 5

# Pod disruption budget - strict for production
podDisruptionBudget:
  enabled: true
  minAvailable: 5

# Strong anti-affinity for production
affinity:
  podAntiAffinity:
    # Required: never schedule two NATS pods on same node
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - nats
        topologyKey: kubernetes.io/hostname
    # Preferred: spread across availability zones
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - nats
          topologyKey: topology.kubernetes.io/zone

# NATS configuration for production
nats:
  logLevel: "warn"
  maxConnections: "5000"
  maxPayload: "2097152"
  writeDeadline: "3s"
