# etcd Bitnami Helm Chart - Production Environment Values
# Used with: helm repo add bitnami https://charts.bitnami.com/bitnami
# Install with: helm install etcd bitnami/etcd -f values-production.yaml

# 5-member cluster for high availability
replicaCount: 5

# Production storage - larger
persistence:
  enabled: true
  size: 50Gi

# Higher resources for production
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

# Strict PDB for production
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Production log level
logLevel: "warn"

# Strong anti-affinity for production
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - etcd
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - etcd
          topologyKey: topology.kubernetes.io/zone

# TLS disabled for production (per requirements)
tls:
  enabled: false
  # autoGenerated: true

# RBAC authentication disabled for production (per requirements)
# Keeping auth config commented for future reference if needed
# auth:
#   rbac:
#     enabled: false
#     # Set a strong root password
#     # rootPassword: "changeme"  # Override this with a secret in ArgoCD

# Enable disaster recovery
disasterRecovery:
  enabled: true
  pvc:
    size: 50Gi
