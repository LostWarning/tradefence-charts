# Production configuration for etcd

appName: etcd
namespace: infrastructure
environment: production

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Pod anti-affinity
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - etcd
        topologyKey: kubernetes.io/hostname
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - etcd
          topologyKey: topology.kubernetes.io/zone

# Storage configuration
persistence:
  enabled: true
  size: 50Gi
