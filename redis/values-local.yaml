# Redis local development values
appName: redis
namespace: infrastructure

# Smaller resources for local development
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Redis configuration for local
redis:
  loglevel: "notice"
  maxmemory: "256mb"
  maxmemoryPolicy: "allkeys-lru"
  timeout: 300
  tcpKeepalive: 300

# Disable pod disruption budget for local single-node
podDisruptionBudget:
  minAvailable: 0
