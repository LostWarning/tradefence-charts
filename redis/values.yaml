# Redis StatefulSet default values
appName: redis
namespace: infrastructure
version: "8.2"
environment: local

# Redis image
image:
  repository: redis
  tag: "8.2-alpine"
  pullPolicy: IfNotPresent

revisionHistoryLimit: 0

# Number of independent Redis replicas
replicaCount: 1

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Pod Disruption Budget
podDisruptionBudget:
  minAvailable: 1

# Pod anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - redis
          topologyKey: kubernetes.io/hostname

# Service configuration
service:
  type: ClusterIP
  port: 6379

# Container port
containerPort: 6379

# Health checks
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Redis configuration
redis:
  # Loglevel can be one of verbose, notice, warning
  loglevel: "notice"

  # Max memory policy: allkeys-lru, volatile-lru, etc.
  maxmemory: "1024mb"
  maxmemoryPolicy: "allkeys-lru"

  # Timeout for idle clients (0 = disabled)
  timeout: 300

  # TCP keepalive
  tcpKeepalive: 300

  # Custom redis.conf parameters
  customConfig: {}
    # Add custom redis configuration here
    # Example:
    # appendonly: "yes"
    # appendfsync: "everysec"
