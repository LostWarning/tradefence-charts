# Local k3d configuration for User Data Repository

appName: data-repository
namespace: app
environment: local
# Docker image
image:
  repository: registry.tradefence.in:5000/data-repository
  tag: latest
  pullPolicy: IfNotPresent
# Replica count (reduced for local)
replicaCount: 2
# Service configuration
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090
# Container ports
grpcPort: 9090
healthPort: 8080
# Resource limits and requests (reduced for local)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Horizontal Pod Autoscaling (disabled for local)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
# Pod Disruption Budget (disabled for local)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# Redis configuration for session management (local Redis)
redis:
  enabled: true
  host: "redis.default.svc.cluster.local" # Local Redis service
  port: 6379
  db: 0
  maxConnections: 50
  timeout: 5
# Application configuration
config:
  logLevel: "DEBUG" # More verbose for local dev
  custom: {}
database:
  postgres_1: "postgres://devuser:devpass@host.k3d.internal:5432/tradefence?sslmode=disable"
