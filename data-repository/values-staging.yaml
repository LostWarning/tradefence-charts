# Staging configuration for User Data Repository

appName: data-repository
namespace: app
environment: staging

# Replica count
replicaCount: 3

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Application configuration
config:
  logLevel: "INFO"
