# Staging configuration for User Data Repository

appName: data-repository
namespace: app
environment: staging

# Replica count
replicaCount: 2

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Application configuration
config:
  logLevel: "INFO"

database:
  postgres_1: "postgres://devuser:devpass@staging.tradefence.in:5432/tradefence?sslmode=disable"
