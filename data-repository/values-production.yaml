# Production configuration for User Data Repository

appName: data-repository
namespace: app
environment: production

# Docker image
image:
  repository: ghcr.io/lostwarning/data-repository
  tag: latest
  pullPolicy: IfNotPresent

# Replica count (HPA will override this)
replicaCount: 10

# Service configuration
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090

# Container ports
grpcPort: 9090
healthPort: 8080

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  
# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 5

# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Redis configuration for session management
redis:
  enabled: true
  host: "10.20.0.3"  # Memorystore private IP (production)
  port: 6379
  db: 0
  maxConnections: 100
  timeout: 5

# Application configuration
config:
  logLevel: "INFO"
  custom: {}
