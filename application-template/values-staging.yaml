# Application template values for staging deployment

appName: myapp
namespace: default
version: "1.0.0"

# Docker image
image:
  repository: gcr.io/YOUR-PROJECT/myapp
  tag: latest
  pullPolicy: IfNotPresent

# Replica count (initial, HPA will scale dynamically)
replicaCount: 3

# Service configuration
service:
  type: ClusterIP
  port: 80

# Container ports
containerPort: 8080
grpcPort: 50051
metricsPort: 9090

# Resource limits and requests (reduced for staging)
resources:
  limits:
    cpu: 500m
    memory: 2Gi
  requests:
    cpu: 100m
    memory: 1Gi

# Horizontal Pod Autoscaling (ENABLED for dynamic stock-based routing)
# Pods dynamically recalculate stock assignments based on current pod count
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  # Custom metrics (optional)
  customMetrics: []
  # - name: http_requests_per_second
  #   targetAverageValue: "1000"

# Pod Disruption Budget
podDisruptionBudget:
  minAvailable: 2

# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Database configuration
database:
  enabled: true
  host: "" # Cloud SQL private IP (from Terraform output)
  port: 5432
  name: tradefence
  poolSize: 20 # Per pod connection pool (20 pods × 20 = 400 connections)
  maxOverflow: 5
  poolTimeout: 30
  migrations:
    enabled: false
    command: ["python", "manage.py", "migrate"]

# Redis configuration
redis:
  enabled: true
  host: "" # Memorystore private IP (from Terraform output)
  port: 6379
  db: 0
  maxConnections: 30
  timeout: 5

# Stock assignment configuration
stockRouting:
  enabled: true
  # Stock assignment strategy: "consistent-hash" or "dynamic"
  strategy: "consistent-hash"
  # Redis keys for stock registry
  stockToPodKey: "stock:{symbol}:pods"
  podToStockKey: "pod:{name}:stocks"
  podHeartbeatKey: "pod:{name}:alive"
  heartbeatTTL: 10 # seconds
  heartbeatInterval: 5 # seconds

# Application configuration
config:
  logLevel: "INFO"
  custom: {}
    # Add your custom config here
    # KEY: "value"

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: api.staging.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-api-tls
      hosts:
        - api.staging.yourdomain.com
  annotations: {}
    # Add custom annotations here
