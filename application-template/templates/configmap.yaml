apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-config
  namespace: {{ .Values.namespace }}
data:
  # Application configuration
  APP_NAME: {{ .Values.appName }}
  APP_ENV: "production"
  LOG_LEVEL: {{ .Values.config.logLevel }}

  # Database configuration (non-sensitive)
  {{- if .Values.database.enabled }}
  DATABASE_HOST: {{ .Values.database.host }}
  DATABASE_PORT: "{{ .Values.database.port }}"
  DATABASE_NAME: {{ .Values.database.name }}
  DATABASE_POOL_SIZE: "{{ .Values.database.poolSize }}"
  DATABASE_MAX_OVERFLOW: "{{ .Values.database.maxOverflow }}"
  DATABASE_POOL_TIMEOUT: "{{ .Values.database.poolTimeout }}"
  DATABASE_SSL_MODE: "require"
  {{- end }}

  # Redis configuration (non-sensitive)
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ .Values.redis.host }}
  REDIS_PORT: "{{ .Values.redis.port }}"
  REDIS_DB: "{{ .Values.redis.db }}"
  REDIS_MAX_CONNECTIONS: "{{ .Values.redis.maxConnections }}"
  REDIS_TIMEOUT: "{{ .Values.redis.timeout }}"
  {{- end }}

  # Stock routing configuration
  {{- if .Values.stockRouting.enabled }}
  STOCK_ROUTING_ENABLED: "{{ .Values.stockRouting.enabled }}"
  STOCK_ROUTING_STRATEGY: {{ .Values.stockRouting.strategy }}
  STOCK_TO_POD_KEY: {{ .Values.stockRouting.stockToPodKey }}
  POD_TO_STOCK_KEY: {{ .Values.stockRouting.podToStockKey }}
  POD_HEARTBEAT_KEY: {{ .Values.stockRouting.podHeartbeatKey }}
  HEARTBEAT_TTL: "{{ .Values.stockRouting.heartbeatTTL }}"
  HEARTBEAT_INTERVAL: "{{ .Values.stockRouting.heartbeatInterval }}"
  {{- end }}

  # Custom application configs
  {{- range $key, $value := .Values.config.custom }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
