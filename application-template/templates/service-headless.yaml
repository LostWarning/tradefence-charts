apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
  annotations:
    # Headless service for direct pod-to-pod gRPC communication
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "false"
spec:
  # Headless service - no cluster IP
  clusterIP: None
  # Do not publish DNS for unready pods
  publishNotReadyAddresses: false
  ports:
    - port: {{ .Values.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.containerPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.appName }}
