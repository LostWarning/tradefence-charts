# Production configuration for API Gateway

appName: event-hub
namespace: app
environment: production

# Docker image
image:
  repository: ghcr.io/lostwarning/event-hub
  tag: latest
  pullPolicy: IfNotPresent

# Replica count (HPA will override this)
replicaCount: 10

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 5

# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# JWT/Auth configuration
auth:
  jwtSecret: ""  # Should be injected from secret
  tokenExpiry: 24h

# Application configuration
config:
  logLevel: "INFO"
# Linkerd service mesh configuration
linkerd:
  inject: true
