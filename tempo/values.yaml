# Local k3d configuration for Grafana Tempo

tempo:
  tempo:
    # Enable persistence for local development
    persistence:
      enabled: true
      size: 5Gi

    # Enable Tempo Query UI for local development
    tempoQuery:
      enabled: true

    # Slightly higher resources for local dev
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
