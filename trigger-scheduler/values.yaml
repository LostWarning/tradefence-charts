# Trigger Scheduler values for local deployment

appName: trigger-scheduler
namespace: app
version: "0.1.0-build.20260124-1251.880e92a"
environment: local
# Docker image
image:
  repository: registry.tradefence.in:5000/trigger-scheduler
  tag: "0.1.0-build.20260124-1251.880e92a"
  pullPolicy: IfNotPresent
revisionHistoryLimit: 0
# Replica count
replicaCount: 2
# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Service configuration
service:
  type: ClusterIP
  port: 9090
  targetPort: 9090
# Container ports
grpcPort: 9090
healthPort: 8080
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# Linkerd service mesh configuration
linkerd:
  inject: true
# Application configuration
config:
  logLevel: "INFO"
  custom: {}
internalServices:
  userDataRepository:
    address: "user-data-repository:9090"
