# Production configuration for Traefik ingress controller

deployment:
  # Start with 10 replicas, HPA will scale up to 50
  replicas: 10


# Port configuration
ports:
  web:
    port: 80
    expose:
      default: true
  websecure:
    port: 443
    expose:
      default: true
    http3:
      enabled: true
    tls:
      enabled: true

# Service configuration
service:
  enabled: true
  type: LoadBalancer
  annotations:
    cloud.google.com/load-balancer-type: "External"
    networking.gke.io/load-balancer-type: "External"

# Ingress class
ingressClass:
  enabled: true
  isDefaultClass: true

# Provider configuration
providers:
  kubernetesIngress:
    namespaces: []  # Watch all namespaces

# Additional arguments
additionalArguments:
  - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
  - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
  - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
  - "--entrypoints.websecure.http.tls=true"
  - "--entrypoints.websecure.http.tls.certResolver=default"
  - "--serversTransport.insecureSkipVerify=true"
  # WebSocket timeout configuration for long-lived connections
  - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
  - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
  - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=3600s"
  - "--serversTransport.forwardingTimeouts.dialTimeout=30s"
  - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=0"
  - "--serversTransport.forwardingTimeouts.idleConnTimeout=3600s"
  # Connection lifecycle
  - "--entrypoints.websecure.transport.lifeCycle.requestAcceptGraceTimeout=0"
  - "--entrypoints.websecure.transport.lifeCycle.graceTimeOut=30s"
  # Logging
  - "--accesslog=true"
  - "--accesslog.format=json"

# Production resource limits
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 5

# Affinity rules for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - traefik
        topologyKey: kubernetes.io/hostname

# Topology spread constraints
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik

# Logging
logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json

# Priority class for critical workloads
priorityClassName: "system-cluster-critical"
