apiVersion: v1
kind: ConfigMap
metadata:
  name: infrastructure-alerts
  namespace: monitoring
data:
  infrastructure-alerts.yaml: |
    groups:
    - name: nodes
      interval: 30s
      rules:
      # Node down
      - alert: NodeDown
        expr: up{job="kubernetes-nodes"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node is down"
          description: "Node {{ "$" }}labels.instance }} has been down for 5 minutes"

      # Node CPU high
      - alert: NodeCPUHigh
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node CPU usage high"
          description: "Node {{ "$" }}labels.instance }} CPU usage is {{ "$" }}value }}%"

      # Node memory high
      - alert: NodeMemoryHigh
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node memory usage high"
          description: "Node {{ "$" }}labels.instance }} memory usage is {{ "$" }}value }}%"

      # Node disk space low
      - alert: NodeDiskSpaceLow
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node disk space low"
          description: "Node {{ "$" }}labels.instance }} disk {{ "$" }}labels.mountpoint }} usage is {{ "$" }}value }}%"

      # Node disk will fill in 24h
      - alert: NodeDiskWillFillSoon
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!="tmpfs"}[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Node disk will fill soon"
          description: "Node {{ "$" }}labels.instance }} disk {{ "$" }}labels.mountpoint }} will fill in 24 hours"

    - name: cluster
      interval: 30s
      rules:
      # Too many pods
      - alert: TooManyPods
        expr: |
          sum(kubelet_running_pods) by (instance) / sum(kube_node_status_capacity{resource="pods"}) by (instance) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Too many pods on node"
          description: "Node {{ "$" }}labels.instance }} is running {{ "$" }}value }} pods (80% of capacity)"

      # API server errors
      - alert: KubernetesAPIServerErrors
        expr: |
          rate(apiserver_request_total{code=~"5.."}[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kubernetes API server errors"
          description: "API server is returning errors for {{ "$" }}value }} requests per second"

      # etcd leader changes
      - alert: EtcdLeaderChanges
        expr: |
          rate(etcd_server_leader_changes_seen_total[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Etcd leader changes frequently"
          description: "Etcd cluster has {{ "$" }}value }} leader changes in the last 10 minutes"

    - name: traefik
      interval: 30s
      rules:
      # Traefik high response time
      - alert: TraefikHighResponseTime
        expr: |
          histogram_quantile(0.95, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (service, le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik high response time"
          description: "Service {{ "$" }}labels.service }} has 95th percentile response time of {{ "$" }}value }}s"

      # Traefik down
      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Traefik is down"
          description: "Traefik instance {{ "$" }}labels.instance }} is down"
