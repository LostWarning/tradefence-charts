# Disable admission webhooks to speed up deployment (safe for local dev)
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  tls:
    enabled: false

# Ensure Grafana is enabled and bundled
grafana:
  enabled: true
  adminPassword: admin
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          orgId: 1
          url: http://prometheus-operated:9090
          isDefault: true
          editable: true
        - name: Tempo
          type: tempo
          access: proxy
          orgId: 1
          url: http://tempo:3100
          isDefault: false
          editable: true
        - name: Loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki-gateway
          isDefault: false
          editable: true

# Grafana dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      # Loki & Logging
      loki-stack:
        gnetId: 13407
        revision: 1
        datasource: Loki

# Reduce resources for faster startup
prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
