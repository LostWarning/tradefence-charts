# Staging configuration for API Gateway

appName: data-ingestion-service
namespace: app
environment: staging

# Replica count
replicaCount: 2

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Application configuration
config:
  logLevel: "INFO"

internalServices:
  telemetryEndpoint: staging-tempo.monitoring:4317