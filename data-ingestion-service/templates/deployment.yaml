apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingestion-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-ingestion-service.labels" . | nindent 4 }}
    environment: {{ .Values.config.environment }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit}}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "data-ingestion-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-ingestion-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.linkerd.inject }}
        linkerd.io/inject: enabled
        {{- end }}
    spec:
      # Service account for workload identity
      serviceAccountName: {{ include "data-ingestion-service.serviceAccountName" . }}

      # Pod anti-affinity for HA
      # Pod anti-affinity for HA
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

      # Topology spread for zone distribution
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}

      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - name: grpc
          containerPort: {{ .Values.service.ports.grpc.targetPort }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.service.ports.http.targetPort }}
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: {{ include "data-ingestion-service.fullname" . }}-config

        # Additional environment variables
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Health checks
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}

        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}

        # Resource limits
        resources:
          {{- toYaml .Values.resources | nindent 10 }}



        # Security context
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}

      # Volumes
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}

      # Security context for pod
      # Security context for pod
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
