# API Gateway values for local deployment

appName: data-ingestion-service
namespace: app
version: "0.1.0-alpha.1"
environment: local

# Docker image
image:
  repository: registry.tradefence.in:5000/data-ingestion-service
  tag: "3f801ea"
  pullPolicy: IfNotPresent

revisionHistoryLimit: 0

# Replica count (HPA will override this)
replicaCount: 2

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Container ports
grpcPort: 9090
healthPort: 8080

# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Linkerd service mesh configuration
linkerd:
  inject: true

# Application configuration
config:
  logLevel: "INFO"
  custom: {}
database:
  postgres_1: "postgres://devuser:devpass@host.k3d.internal:5432/tradefence?sslmode=disable"
etcd:
  endpoints:
    - "http://etcd-0.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-1.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-2.etcd.infrastructure.svc.cluster.local:2379"
internalServices:
  telemetryEndpoint: tempo.monitoring:4317
  logEndpoint: http://loki-write.monitoring.svc.cluster.local:3100/loki/api/v1/push
