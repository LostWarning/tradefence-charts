# Production configuration for API Gateway

appName: data-ingestion-service
namespace: app
environment: production

# Replica count
replicaCount: 3

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Application configuration
config:
  logLevel: "INFO"

internalServices:
  telemetryEndpoint: prod-tempo.monitoring:4317