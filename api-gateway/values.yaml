# API Gateway values for local deployment

appName: api-gateway
namespace: app
version: "1.0.0.alpha.1-build.20260126-0022.e56f256"
environment: local
# Docker image
image:
  repository: registry.tradefence.in:5000/api-gateway
  tag: "1.0.0.alpha.1-build.20260126-0022.e56f256"
  pullPolicy: IfNotPresent
revisionHistoryLimit: 0
# Replica count
replicaCount: 2
# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
containerPort: 8080
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: api.local.tradefence.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-local-tradefence-tls
      hosts:
        - api.local.tradefence.in
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
# Linkerd service mesh configuration
linkerd:
  inject: true
# Application configuration
config:
  logLevel: "INFO"
rateLimiter:
  enabled: true
  type: "pod_ip"
  rps: 1
  burst: 5
internalServices:
  userServiceGRPC: user-service:9090
  telemetryEndpoint: tempo.monitoring:4317
  logEndpoint: http://loki-write.monitoring.svc.cluster.local:3100/loki/api/v1/push
