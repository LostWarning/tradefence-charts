# Default values for api-gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Superseded by standard standard Helm naming, but kept if needed for specific logic (though usually redundant)
# appName: api-gateway

replicaCount: 2

image:
  repository: registry.tradefence.in:5000/api-gateway
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0.alpha.3-build.20260127-0151.3006f73"

imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: true
  ingressClassName: traefik
  annotations: {}
  hosts:
    - host: api.local.tradefence.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.local.tradefence.in
      secretName: api-local-tradefence-tls

resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api-gateway
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: api-gateway

# Application specific configuration
config:
  logLevel: INFO
  environment: local
  rateLimiter:
    enabled: true
    type: pod_ip
    burst: 5
    rps: 1
  internalServices:
    userServiceGRPC: user-service:9090
    telemetryEndpoint: tempo.monitoring:4317
  custom: {}

containerPort: 8080

linkerd:
  inject: true

livenessProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /ready
    port: http
  failureThreshold: 3
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3

podDisruptionBudget:
  enabled: false
  minAvailable: 1

revisionHistoryLimit: 0
