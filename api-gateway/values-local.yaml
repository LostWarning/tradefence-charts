# Local k3d configuration for API Gateway

appName: api-gateway
namespace: app
environment: local
# Docker image
image:
  repository: ghcr.io/lostwarning/api-gateway
  tag: main-a801e84
  pullPolicy: IfNotPresent
# Replica count (reduced for local)
replicaCount: 2
# Resource limits and requests (reduced for local)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Horizontal Pod Autoscaling (disabled for local)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
# Pod Disruption Budget (disabled for local)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# JWT/Auth configuration
auth:
  jwtSecret: "local-dev-secret-change-me" # Local dev secret
  tokenExpiry: 24h
rateLimiter:
  enabled: true
  type: "pod_ip"
  rps: 1
  burst: 5
# Application configuration
config:
  logLevel: "DEBUG" # More verbose for local dev
# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: api.local.tradefence.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-local-tradefence-tls
      hosts:
        - api.local.tradefence.in
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
# Linkerd service mesh configuration
linkerd:
  inject: true
