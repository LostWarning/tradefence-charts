# Staging configuration for API Gateway

appName: api-gateway
namespace: app
environment: staging

# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: api.staging.tradefence.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-tradefence-tls
      hosts:
        - api.staging.tradefence.in
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"

# Linkerd service mesh configuration
linkerd:
  inject: true

# Application configuration
config:
  logLevel: "INFO"

internalServices:
  telemetryEndpoint: staging-tempo.monitoring:4317
