# Local k3d configuration for API Gateway

appName: ws-gateway
namespace: app
environment: local
# Docker image
image:
  repository: ghcr.io/lostwarning/ws-gateway
  tag: main-787b544
  pullPolicy: IfNotPresent
# Replica count (reduced for local)
replicaCount: 2
# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
# Container ports
containerPort: 8080
metricsPort: 9090
# Resource limits and requests (reduced for local)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi
# Horizontal Pod Autoscaling (disabled for local)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  # Custom metrics for WebSocket connections
  customMetrics:
    - name: websocket_connections_per_pod
      targetAverageValue: "1000"
# Pod Disruption Budget (disabled for local)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
redis:
  host: "redis-0.redis-headless" # Local Redis service
  port: 6379
  maxConnections: 50
  timeout: 5
# JWT/Auth configuration
auth:
  jwtSecret: "local-dev-secret-change-me" # Local dev secret
  tokenExpiry: 24h
rateLimiter:
  enabled: true
  type: "pod_ip"
  rps: 1
  burst: 5
# Application configuration
config:
  logLevel: "DEBUG" # More verbose for local dev
  websocketReadBufferSize: 4096
  websocketWriteBufferSize: 4096
  websocketMaxMessageSize: 1048576 # 1MB
  custom: {}
# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: ws.local.tradefence.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: local-tls
      hosts:
        - ws.local.tradefence.in
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
    # WebSocket protocol upgrade support
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
