# WebSocket Gateway values for local deployment

appName: ws-gateway
namespace: app
version: "0.1.0-alpha.1"
environment: local

# Docker image
image:
  repository: registry.tradefence.in:5000/ws-gateway
  tag: 0.1.0-alpha.1
  pullPolicy: IfNotPresent

revisionHistoryLimit: 0

# Replica count
replicaCount: 2

# Resource limits and requests
resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  # Custom metrics for WebSocket connections
  customMetrics:
    - name: websocket_connections_per_pod
      targetAverageValue: "5000"

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Service configuration
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
# Container ports
containerPort: 8080
metricsPort: 9090

# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: ws.local.tradefence.in
      paths:
        - path: /
          pathType: Prefix
    - host: ws.local.tradefence.in
      paths:
        - path: /ws
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - ws.local.tradefence.in
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"

# Linkerd service mesh configuration
linkerd:
  inject: true

# gRPC client configuration
grpc:
  keepaliveTime: 10s
  keepaliveTimeout: 3s
  permitWithoutStream: true
  maxConnectionIdle: 30m
  maxConnectionAge: 1h

# Application configuration
config:
  logLevel: "INFO"
  websocketReadBufferSize: 4096
  websocketWriteBufferSize: 4096
  websocketMaxMessageSize: 1048576 # 1MB
  custom: {}
rateLimiter:
  enabled: true
  type: "pod_ip"
  rps: 1
  burst: 5
etcd:
  endpoints:
    - "http://etcd-0.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-1.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-2.etcd.infrastructure.svc.cluster.local:2379"
internalServices:
  userService: http://user-service:8080
