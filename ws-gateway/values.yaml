# API Gateway values for production deployment

appName: ws-gateway
namespace: app
version: "1.0.0"
environment: production
# Docker image
image:
  repository: ghcr.io/lostwarning/ws-gateway
  tag: main-787b544
  pullPolicy: IfNotPresent
# Replica count (HPA will override this)
replicaCount: 10
revisionHistoryLimit: 0
# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
# Container ports
containerPort: 8080
metricsPort: 9090
# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi
# Horizontal Pod Autoscaling
autoscaling:
  enabled: true
  minReplicas: 10
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilization: 300
  scaleUpStabilization: 0
  # Custom metrics for WebSocket connections
  customMetrics:
    - name: websocket_connections_per_pod
      targetAverageValue: "5000"
# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 5
# Health checks
livenessProbe:
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  path: /ready
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
redis:
  host: redis-0.redis-headless
  port: 6379
  maxConnections: 100
  timeout: 5
# gRPC client configuration
grpc:
  keepaliveTime: 10s
  keepaliveTimeout: 3s
  permitWithoutStream: true
  maxConnectionIdle: 30m
  maxConnectionAge: 1h
# JWT/Auth configuration
auth:
  jwtSecret: "" # Should be injected from secret
  tokenExpiry: 24h
# Application configuration
config:
  logLevel: "INFO"
  websocketReadBufferSize: 4096
  websocketWriteBufferSize: 4096
  websocketMaxMessageSize: 1048576 # 1MB
  custom: {}
rateLimiter:
  enabled: true
  type: "pod_ip"
  rps: 1
  burst: 5
etcd:
  endpoints:
    - "http://etcd-0.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-1.etcd.infrastructure.svc.cluster.local:2379"
    - "http://etcd-2.etcd.infrastructure.svc.cluster.local:2379"
internalServices:
  userService: http://user-service:8080
# Ingress configuration
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: api.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
    - host: ws.yourdomain.com
      paths:
        - path: /ws
          pathType: Prefix
  tls:
    - secretName: api-tls
      hosts:
        - api.yourdomain.com
        - ws.yourdomain.com
  annotations:
    # WebSocket sticky sessions
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "gateway-session"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
# Linkerd service mesh configuration
linkerd:
  inject: true
